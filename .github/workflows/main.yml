name: FiyatAvcisiTR Bulut v3 APK Derle

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'cloud_monitor/deals_snapshot.json'
      - 'cloud_monitor/watchlist.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Debug APK derle
        run: |
          if [ -f "FiyatAvcisiTR_Bulut_v3/settings.gradle.kts" ]; then cd FiyatAvcisiTR_Bulut_v3; fi
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FiyatAvcisiTR-Bulut-v3-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
